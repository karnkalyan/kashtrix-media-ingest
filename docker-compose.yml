services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kashtrix_db}
      MYSQL_USER: ${MYSQL_USER:-kashtrix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - kashtrix

  backend:
    build:
      context: ./backend
      additional_contexts:
        license-sdk: ../sdk/node
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-kashtrix}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-kashtrix_db}
      KTE_JWT_SECRET: ${KTE_JWT_SECRET:?KTE_JWT_SECRET is required}
      KTX_LICENSE_SERVER_URL: ${KTX_LICENSE_SERVER_URL:-https://license.simulcast.com.np}
      KTX_LICENSE_SERVER_HOST: ${KTX_LICENSE_SERVER_HOST:-license.simulcast.com.np}
      KTX_LICENSE_SERVER_PORT: ${KTX_LICENSE_SERVER_PORT:-7443}
      KTX_LICENSE_SERVERNAME: ${KTX_LICENSE_SERVERNAME:-license.simulcast.com.np}
      KTX_LICENSE_TENANT_ID: ${KTX_LICENSE_TENANT_ID:-512eb440-cc57-4842-8c6d-51ff83e87adf}
      KTX_LICENSE_APPLICATION_ID: ${KTX_LICENSE_APPLICATION_ID:-62ae6ba5-188f-4f63-9007-29f5dd65e036}
      KTX_LICENSE_CA_PATH: /run/secrets/license-ca.pem
      KTX_LICENSE_CLIENT_CERT_PATH: /run/secrets/license-client-cert.pem
      KTX_LICENSE_CLIENT_KEY_PATH: /run/secrets/license-client-key.pem
      KTX_LICENSE_PUBLIC_KEY_PATH: /run/secrets/license-ed25519-public.pem
      FFMPEG_PATH: /usr/local/bin/ffmpeg
      FFPROBE_PATH: /usr/local/bin/ffprobe
    ports:
      - "1935:1935"
    expose:
      - "3005"
      - "8080"
    volumes:
      - recording-data:/app/media
      - ./certs/production/ca-cert.pem:/run/secrets/license-ca.pem:ro
      - ./certs/production/client-cert.pem:/run/secrets/license-client-cert.pem:ro
      - ./certs/production/client-key.pem:/run/secrets/license-client-key.pem:ro
      - ./certs/production/license-ed25519-public.pem:/run/secrets/license-ed25519-public.pem:ro
      - license-client-data:/app/data/secure-license
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3005/api/license/status"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - kashtrix

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-3000}:80"
    networks:
      - kashtrix

volumes:
  mysql-data:
  recording-data:
  license-client-data:

networks:
  kashtrix:
    driver: bridge
