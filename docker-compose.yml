services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kashtrix_db}
      MYSQL_USER: ${MYSQL_USER:-kashtrix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - kashtrix

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-kashtrix}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-kashtrix_db}
      KTE_JWT_SECRET: ${KTE_JWT_SECRET:?KTE_JWT_SECRET is required}
      KTE_DEFAULT_USERNAME: ${KTE_DEFAULT_USERNAME:-}
      KTE_DEFAULT_PASSWORD: ${KTE_DEFAULT_PASSWORD:-}
      KTE_HWID: ${KTE_HWID:-}
      FFMPEG_PATH: /usr/local/bin/ffmpeg
      FFPROBE_PATH: /usr/local/bin/ffprobe
    ports:
      - "1935:1935"
    expose:
      - "3005"
      - "8080"
    volumes:
      - recording-data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3005/api/license/status"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - kashtrix

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-3000}:80"
    networks:
      - kashtrix

volumes:
  mysql-data:
  recording-data:

networks:
  kashtrix:
    driver: bridge
