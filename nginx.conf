server {
    listen 80;
    server_name ingest.kashtrix.com ingest.kasthrix.com localhost _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10g;

    location /api/ {
        proxy_pass http://backend:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://backend:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Keep HLS, DASH, media explorer, recordings and previews on the same public origin.
    # This prevents HTTPS mixed-content failures and provides seamless media browsing.
    location ~ ^/(live|dash|hls|media|recordings|recorded|recording-thumbnail|recording-preview|vod|ts)(/|$) {
        proxy_pass http://backend:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
